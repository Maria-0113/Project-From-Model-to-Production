name: Retraining

on:

  schedule:
    - cron: "0 0 1 * *"
  
  push:
    paths:
      - "src/data/**"

  workflow_dispatch:


jobs:

  retrain:

    runs-on: self-hosted

    env:
      API_KEY: ${{ secrets.API_KEY }}

    steps:

      - uses: actions/checkout@v4
        with:
          lfs: true


      - name: Wait for API 
        run: |
          until curl -f http://localhost:8000/health
          do
            sleep 5
          done

      - name: Detect data drift
        id: drift
        run: |
           RESPONSE=$(curl -fsS -X POST \
            -H "X-API-Key: $API_KEY" \
            http://localhost:8000/detect-drift)

            echo "API response: $RESPONSE"
            echo "drift=$RESPONSE" >> "$GITHUB_OUTPUT"

      - name: Train
        if: steps.drift.outputs.drift == 'true'
        id: train
        run: |
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
          -H "X-API-Key: $API_KEY" \
          http://localhost:8000/models)


          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -1 | cut -d: -f2)
          RESPONSE=$(echo "$HTTP_RESPONSE" | sed '$d')

          echo "HTTP status: $HTTP_STATUS"
          echo "Response body: $RESPONSE"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Train request failed with status $HTTP_STATUS"
            exit 1
          fi

          MODEL_ID=$(echo "$RESPONSE" | jq -r '.model_id')
          IS_BETTER=$(echo "$RESPONSE" | jq -r '.is_better')

          echo "model_id=$MODEL_ID" >> "$GITHUB_OUTPUT"
          echo "is_better=$IS_BETTER" >> "$GITHUB_OUTPUT"
        
      - name: Show API logs on failure
        if: failure()
        working-directory: ./src
        run: |
          echo "---- docker compose logs (app service, last 100 lines) ----"
          docker compose logs --tail 100 app



      - name: Deploy
        if: steps.train.outputs.is_better == 'true' 
        run: |
          curl -X POST \
          -H "X-API-Key: $API_KEY" \
          -F "model_id=${{ steps.train.outputs.model_id }}" \
          http://localhost:8000/deploy

    